<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SkillQuest verification code</title>
  </head>
  <body style="margin:0;padding:0;background-color:#ffffff;font-family:Arial,Helvetica,sans-serif;color:#000000;">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="background-color:#ffffff;">
      <tr>
        <td align="center" style="padding:32px 16px;">
          <table role="presentation" width="560" cellspacing="0" cellpadding="0" border="0" style="max-width:560px;width:100%;">
            <tr>
              <td style="padding:0 0 20px 0;font-size:28px;font-weight:700;letter-spacing:-0.5px;color:#111111;">
                SkillQuest
              </td>
            </tr>
            <tr>
              <td style="border-top:1px solid #e6e6e6;font-size:0;line-height:0;">&nbsp;</td>
            </tr>
            <tr>
              <td style="padding:28px 0 0 0;font-size:16px;line-height:24px;color:#111111;">
                Hi {{first_name}},
              </td>
            </tr>
            <tr>
              <td style="padding:12px 0 0 0;font-size:16px;line-height:24px;color:#111111;">
                Use the code below to finish signing in.
              </td>
            </tr>
            <tr>
              <td style="padding:28px 0 0 0;">
                <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0">
                  <tr>
                    <td align="center" style="background-color:#f3f3f3;padding:28px 16px;font-size:36px;font-weight:700;letter-spacing:4px;color:#111111;">
                      {{code}}
                    </td>
                  </tr>
                </table>
              </td>
            </tr>
            <tr>
              <td style="padding:20px 0 0 0;font-size:16px;line-height:24px;color:#111111;">
                This code expires in {{expire_minutes}} minutes.
              </td>
            </tr>
            <tr>
              <td style="padding:16px 0 0 0;font-size:16px;line-height:24px;color:#111111;">
                Didn't request this code?
                <a href="{{contact_url}}" style="color:#5624d0;text-decoration:underline;">Contact us</a>.
              </td>
            </tr>
            <tr>
              <td style="padding:72px 0 0 0;font-size:12px;line-height:18px;color:#8a8a8a;">
                Delivered by SkillQuest
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
